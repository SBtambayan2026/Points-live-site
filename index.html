<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SB Tambayan - Points Site</title>
<style>
  body { font-family: Arial; background: #111; color: white; text-align: center; padding: 20px; }
  .container { max-width: 500px; margin: auto; background: #222; padding: 20px; border-radius: 15px; }
  input, button { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px; }
  .btn { background: #28a745; color: white; font-weight: bold; cursor: pointer; }
  .btn-red { background: #dc3545; }
  .btn-yellow { background: #ffc107; color: black; }
  .points { font-size: 35px; color: #ffc107; font-weight: bold; }
  #gameArea { margin-top: 15px; padding: 15px; background: #333; border-radius: 10px; }
</style>
</head>
<body>
<div class="container">
  <h1>SB TAMBAYAN 🔥</h1>
  <p>Ipunan ng Points!</p>

  <div id="authBox">
    <input type="email" id="email" placeholder="Email mo">
    <input type="password" id="password" placeholder="Password">
    <button class="btn" onclick="register()">Register</button>
    <button class="btn btn-yellow" onclick="login()">Login</button>
  </div>

  <div id="mainBox" style="display:none">
    <h3>Welcome, <span id="userEmail"></span></h3>
    <p>Points mo: <span class="points" id="points">0</span></p>
    <button class="btn btn-red" onclick="logout()">Logout</button>
    <hr>
    <h3>MGA LARO</h3>
    <button class="btn" onclick="playQuiz()">1. Quiz Game +10 pts</button>
    <button class="btn btn-yellow" onclick="playClicker()">2. Clicker Game +1 pt</button>
    <button class="btn btn-yellow" onclick="playColorGame()">3. Color Game +5 pts</button>
    <div id="gameArea"></div>
  </div>
</div>

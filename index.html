<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABONG TAMBAYAN</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101522;
  color:white;
}
header{
  background:#182238;
  padding:20px;
  text-align:center;
}
header h1{margin:0;font-size:28px}
.container{
  width:92%;
  max-width:600px;
  margin:20px auto;
}
.card{
  background:#1b263d;
  padding:20px;
  border-radius:15px;
  margin-bottom:18px;
}
input{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  margin:8px 0;
}
button{
  border:0;
  border-radius:8px;
  padding:11px 16px;
  margin:4px;
  cursor:pointer;
  font-weight:bold;
}
.join{background:#21c477;color:white;width:100%}
.react{background:#293650;color:white}
.post{
  background:#111a2b;
  padding:15px;
  border-radius:10px;
  margin-top:12px;
}
.small{color:#aeb8cc;font-size:13px}
</style>
</head>

<body>

<header>
  <h1>🐓 SABONG TAMBAYAN</h1>
  <div class="small">Community • Join • React</div>
</header>

<div class="container">

  <div class="card" id="joinBox">
    <h2>👤 Join SABONG TAMBAYAN</h2>
    <p>Ilagay ang pangalan mo para makapasok.</p>

    <input id="name" type="text" placeholder="Iyong pangalan">

    <button class="join" onclick="joinCommunity()">
      JOIN NOW
    </button>
  </div>

  <div class="card" id="profile" style="display:none">
    <h2>👤 My Profile</h2>
    <p id="profileName"></p>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <h2>📢 Admin Announcement</h2>

    <div class="post">
      <b>👑 Admin</b>
      <p>Welcome sa SABONG TAMBAYAN!</p>

      <button class="react" onclick="react(this,'👍')">👍 <span>0</span></button>
      <button class="react" onclick="react(this,'❤️')">❤️ <span>0</span></button>
      <button class="react" onclick="react(this,'😆')">😆 <span>0</span></button>
    </div>
  </div>

  <div class="card">
    <h2>👥 Members</h2>
    <div id="members">
      <p class="small">Wala pang members.</p>
    </div>
  </div>

</div>

<script>
let members = JSON.parse(localStorage.getItem("members") || "[]");

function joinCommunity(){
  const name = document.getElementById("name").value.trim();

  if(!name){
    alert("Ilagay muna ang pangalan mo.");
    return;
  }

  members.push(name);
  localStorage.setItem("members", JSON.stringify(members));

  document.getElementById("profileName").innerHTML =
    "Name: <b>" + escapeHTML(name) + "</b>";

  document.getElementById("joinBox").style.display="none";
  document.getElementById("profile").style.display="block";

  showMembers();
}

function showMembers(){
  const box=document.getElementById("members");

  if(members.length===0){
    box.innerHTML='<p class="small">Wala pang members.</p>';
    return;
  }

  box.innerHTML=members.map((name,index)=>
    "<p>👤 "+(index+1)+". "+escapeHTML(name)+"</p>"
  ).join("");
}

function logout(){
  document.getElementById("profile").style.display="none";
  document.getElementById("joinBox").style.display="block";
}

function react(button,emoji){
  const span=button.querySelector("span");
  span.textContent=parseInt(span.textContent)+1;
}

function escapeHTML(text){
  return text.replace(/[&<>"']/g,function(m){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m];
  });
}

showMembers();
</script>

</body>
</html>

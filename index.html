<!DOCTYPE html>
<html>
<head>
<title>BIBOY BUSINESS PORTAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:0}
.login-box{background:#262626;width:90%;max-width:400px;margin:50px auto;padding:30px;border-radius:12px;text-align:center}
input,select{width:90%;padding:12px;margin:10px 0;border:none;border-radius:8px;background:#333;color:#fff}
.btn{background:#ffb700;color:#000;border:none;width:95%;padding:14px;border-radius:10px;font-weight:bold;cursor:pointer;margin:5px 0}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#0a0a0a}
.username{color:#ffb700;font-weight:bold}
.card{background:#262626;margin:15px;padding:20px;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
img{width:100%;max-width:600px;margin:15px auto;display:block;border-radius:10px;padding:0 15px;box-sizing:border-box}
#customerDash,#agentDash{display:none}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-box">
  <h2>🏪 BIBOY BUSINESS</h2>
  <p style="color:gray;font-size:12px">Mag-register muna para makapasok</p>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="pass" placeholder="Password">
  <select id="accType">
    <option value="customer">Customer Account</option>
    <option value="agent">Agent/Admin Account</option>
  </select>
  <button class="btn" onclick="register()">REGISTER</button>
  <button class="btn" onclick="login()">LOGIN</button>
</div>

<!-- CUSTOMER DASHBOARD -->
<div id="customerDash">
  <div class="topbar">
    <span>Customer Portal</span>
    <span class="username" id="custName"></span>
    <button onclick="logout()" style="background:red;color:#fff;border:none;padding:8px;border-radius:5px">Logout</button>
  </div>
  
  <img src="SABONGTAMBAYAN.jpg">

  <div class="card">
    <h3>Welcome!</h3>
    <div class="grid">
      <div><b>Points:</b> 250</div>
      <div><b>Orders:</b> 3</div>
    </div>
    <button class="btn">Order Now</button>
  </div>

  <div class="card">
    <h3>NANG MGA ASWANG</h3>

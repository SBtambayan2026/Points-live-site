<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PointWallet</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#1266f1;
  color:white;
  padding:25px 20px;
  border-radius:0 0 28px 28px;
}

.container{
  width:92%;
  max-width:500px;
  margin:auto;
}

.logo{
  font-size:24px;
  font-weight:bold;
  margin-bottom:20px;
}

.balance{
  font-size:36px;
  font-weight:bold;
  margin-top:5px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin:20px 0;
}

button{
  border:0;
  border-radius:14px;
  padding:16px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.action{
  background:white;
  box-shadow:0 3px 12px #0001;
}

.primary{
  background:#1266f1;
  color:white;
  width:100%;
}

.card{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px #0001;
}

input{
  width:100%;
  padding:14px;
  margin:7px 0 12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.hidden{
  display:none;
}

.transaction{
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.plus{
  color:#159447;
}

.minus{
  color:#d93025;
}

.small{
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login" class="container" style="padding-top:70px">

<div class="card">

<h1>⭐ PointWallet</h1>

<p>Points wallet prototype</p>

<input id="username"
placeholder="Username">

<input id="password"
type="password"
placeholder="Password">

<button class="primary"
onclick="loginUser()">
LOGIN
</button>

</div>

</div>


<!-- APP -->

<div id="app" class="hidden">

<header>

<div class="container">

<div class="logo">
⭐ PointWallet
</div>

<div>
Available Points
</div>

<div class="balance"
id="balance">
0
</div>

</div>

</header>


<div class="container">

<div class="actions">

<button class="action"
onclick="openBox('send')">
📤 Send Points
</button>

<button class="action"
onclick="openBox('receive')">
📥 Receive
</button>

<button class="action"
onclick="openBox('withdraw')">
💸 Withdraw
</button>

<button class="action"
onclick="openBox('history')">
📋 History
</button>

</div>


<!-- SEND -->

<div id="send"
class="card hidden">

<h3>📤 Send Points</h3>

<input id="receiver"
placeholder="Receiver username">

<input id="sendAmount"
type="number"
placeholder="Points">

<button class="primary"
onclick="sendPoints()">
SEND POINTS
</button>

</div>


<!-- RECEIVE -->

<div id="receive"
class="card hidden">

<h3>📥 Receive Points</h3>

<p>
Your username:
</p>

<b id="myUsername">
</b>

<p class="small">
Give your username to another PointWallet user
to receive points.
</p>

</div>


<!-- WITHDRAW -->

<div id="withdraw"
class="card hidden">

<h3>💸 Withdraw Request</h3>

<p class="small">
Demo only. This does not send real money.
</p>

<input id="withdrawAmount"
type="number"
placeholder="Points">

<input id="gcashName"
placeholder="GCash account name">

<input id="gcashNumber"
placeholder="GCash mobile number">

<button class="primary"
onclick="withdrawRequest()">
REQUEST WITHDRAWAL
</button>

</div>


<!-- HISTORY -->

<div id="history"
class="card hidden">

<h3>📋 Transaction History</h3>

<div id="transactions">
No transactions yet.
</div>

</div>

</div>

</div>


<script>

let points = 1000;

let username = "";


/* LOGIN */

function loginUser(){

username =
document.getElementById("username").value.trim();

let password =
document.getElementById("password").value;

if(username === "" || password === ""){

alert("Please enter username and password.");

return;

}

document.getElementById("login")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

document.getElementById("myUsername")
.innerText = username;

updateBalance();

}


/* BALANCE */

function updateBalance(){

document.getElementById("balance")
.innerText =
points.toLocaleString();

}


/* OPEN BOX */

function openBox(id){

document
.getElementById(id)
.classList.toggle("hidden");

}


/* SEND */

function sendPoints(){

let receiver =
document.getElementById("receiver")
.value.trim();

let amount =
Number(
document.getElementById("sendAmount")
.value
);

if(receiver === "" || amount <= 0){

alert("Enter receiver and amount.");

return;

}

if(amount > points){

alert("Not enough points.");

return;

}

if(receiver === username){

alert("You cannot send points to yourself.");

return;

}

points -= amount;

updateBalance();

addTransaction(
"Sent to " + receiver,
amount,
"minus"
);

alert(
amount.toLocaleString() +
" points sent successfully!"
);

}


/* WITHDRAW REQUEST */

function withdrawRequest(){

let amount =
Number(
document.getElementById("withdrawAmount")
.value
);

let name =
document.getElementById("gcashName")
.value.trim();

let number =
document.getElementById("gcashNumber")
.value.trim();

if(amount <= 0 ||
name === "" ||
number === ""){

alert("Complete all information.");

return;

}

if(amount > points){

alert("Not enough points.");

return;

}

points -= amount;

updateBalance();

addTransaction(
"Withdrawal request to GCash ending " +
number.slice(-4),
amount,
"minus"
);

alert(
"Withdrawal request submitted for admin review."
);

}


/* TRANSACTIONS */

function addTransaction(
title,
amount,
type
){

let box =
document.getElementById("transactions");

if(box.innerText ===
"No transactions yet."){

box.innerHTML = "";

}

let item =
document.createElement("div");

item.className =
"transaction";

item.innerHTML =

"<b>" + title + "</b>" +

"<br>" +

"<span class='" + type + "'>" +

(type === "plus" ? "+" : "-") +

amount.toLocaleString() +

" points</span>" +

"<br>" +

"<span class='small'>" +

new Date().toLocaleString() +

"</span>";

box.prepend(item);

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss Arcade - Play & Earn</title>
  <style>
    body { background: #0f0f1a; color: white; font-family: Arial; margin: 0; padding: 20px; text-align: center; }
    .box { background: #1e1e2f; padding: 20px; border-radius: 10px; max-width: 500px; margin: 20px auto; }
    .btn { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; }
    .btn-blue { background: #2563eb; } .btn-green { background: #16a34a; } .btn-yellow { background: #f59e0b; } .btn-red { background: #dc2626; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
    .game { display: none; }
    .points { font-size: 24px; color: #fbbf24; font-weight: bold; }
    #gameArea { width: 100%; height: 200px; background: #000; margin: 10px 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  </style>
</head>
<body>

  <h1>🎮 BOSS ARCADE 🎮</h1>
  <p>Ipon Points = Kikita ka sa Ads</p>

  <!-- LOGIN BOX -->
  <div id="login-box" class="box">
    <h2>Login / Register</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button class="btn btn-blue" onclick="register()">Mag Register</button>
    <button class="btn btn-green" onclick="login()">Login</button>
    <p id="auth-msg"></p>
  </div>

  <!-- ARCADE BOX -->
  <div id="arcade-box" class="box" style="display:none;">
    <h2>Welcome Boss! <button class="btn btn-red" style="width:auto; padding:5px 10px;" onclick="logout()">Logout</button></h2>
    <p>Your Points: <span class="points" id="points">0</span></p>
    
    <h3>Pili ng Laro:</h3>
    <button class="btn btn-yellow" onclick="playQuiz()">1. Quiz Game +10 pts</button>
    <button class="btn btn-yellow" onclick="playClicker()">2. Clicker Game +1 pt</button>
    
    <div id="gameArea">Pumili ka ng laro boss</div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // CONFIG MO TO BOSS
  const firebaseConfig = {
    apiKey: "AIzaSyDKOP3TyAeYcP_DlGbeMq9xIk9r_pKkux0",
    authDomain: "biboy-story-demo.firebaseapp.com",
    projectId: "biboy-story-demo",
    storageBucket: "biboy-story-demo.firebasestorage.app",
    messagingSenderId: "675994722486",
    appId: "1:675994722486:web:5ba719c8c6b9fa8c1dc617"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  let points = 0;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('arcade-box').style.display = 'block';
    } else {
      document.getElementById('login-box').style.display = 'block';
      document.getElementById('arcade-box').style.display = 'none';
    }
  });

  window.register = function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    createUserWithEmailAndPassword(auth, email, password)
    .then(() => { document.getElementById('auth-msg').innerText = "Registered! ✅" })
    .catch((error) => { document.getElementById('auth-msg').innerText = "Error: " + error.message });
  }

  window.login = function() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    signInWithEmailAndPassword(auth, email, password)
    .catch((error) => { document.getElementById('auth-msg').innerText = "Error: " + error.message });
  }

  window.logout = function() { signOut(auth); }

  window.playQuiz = function() {
    points += 10;
    document.getElementById('points').innerText = points;
    document.getElementById('gameArea').innerHTML = "Tama! +10 Points 🎉";
  }

  window.playClicker = function() {
    points += 1;
    document.getElementById('points').innerText = points;
    document.getElementById('gameArea').innerHTML = `Click mo ko! Points: ${points} <br><button onclick="playClicker()" class="btn btn-yellow">CLICK!</button>`;
  }

</script>
</body>
</html>

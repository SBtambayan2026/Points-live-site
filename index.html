<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SB Tambayan Gaming</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
}
.container{
  width:92%;
  max-width:500px;
  margin:30px auto;
}
.card{
  background:#151d33;
  padding:22px;
  border-radius:18px;
  margin-bottom:18px;
  box-shadow:0 8px 25px #0006;
}
h1{text-align:center;color:#39e75f}
h2{margin-top:0}
input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:0;
  border-radius:10px;
  background:#27304a;
  color:white;
}
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#39e75f;
  color:#06100a;
  font-weight:bold;
  font-size:16px;
}
button:active{transform:scale(.98)}
.points{
  text-align:center;
  font-size:40px;
  font-weight:bold;
  color:#ffd43b;
}
.game{
  background:#202a44;
  padding:15px;
  border-radius:12px;
  margin:10px 0;
}
.small{
  text-align:center;
  color:#aeb7cc;
}
#dashboard{display:none}
</style>
</head>

<body>

<div class="container">

  <div id="login" class="card">
    <h1>🎮 SB TAMBAYAN</h1>
    <p class="small">Gaming Platform Prototype</p>

    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">LOGIN</button>
    <button onclick="register()" style="background:#27304a;color:white">
      CREATE ACCOUNT
    </button>

    <p id="message" class="small"></p>
  </div>

  <div id="dashboard">

    <div class="card">
      <h1>🎮 GAMING HUB</h1>
      <p class="small">Welcome, <span id="player"></span>!</p>

      <div class="points" id="points">0</div>
      <p class="small">VIRTUAL POINTS</p>
    </div>

    <div class="card">
      <h2>🎯 Games</h2>

      <div class="game">
        <b>⚡ Click Challenge</b>
        <p>Click the button to earn virtual points.</p>
        <button onclick="earnPoints(1)">PLAY +1 POINT</button>
      </div>

      <div class="game">
        <b>🏆 Bonus Challenge</b>
        <p>Complete a challenge and earn points.</p>
        <button onclick="earnPoints(5)">COMPLETE +5 POINTS</button>
      </div>

      <div class="game">
        <b>🎲 Lucky Number</b>
        <p>Pick a number from 1–5.</p>
        <button onclick="lucky()">PLAY</button>
      </div>
    </div>

    <div class="card">
      <h2>🏆 My Profile</h2>
      <p>Player: <b id="profile"></b></p>
      <p>Points: <b id="profilePoints">0</b></p>
      <button onclick="logout()" style="background:#e74c3c;color:white">
        LOGOUT
      </button>
    </div>

  </div>

</div>

<script>

let playerName = localStorage.getItem("playerName");
let points = Number(localStorage.getItem("points") || 0);

function showDashboard(){
  if(playerName){
    document.getElementById("login").style.display="none";
    document.getElementById("dashboard").style.display="block";

    document.getElementById("player").innerText=playerName;
    document.getElementById("profile").innerText=playerName;

    updatePoints();
  }
}

function register(){
  let name=document.getElementById("username").value.trim();
  let pass=document.getElementById("password").value;

  if(!name || !pass){
    document.getElementById("message").innerText=
      "Please enter username and password.";
    return;
  }

  localStorage.setItem("playerName",name);
  localStorage.setItem("points","0");

  playerName=name;
  points=0;

  showDashboard();
}

function login(){
  let name=document.getElementById("username").value.trim();
  let pass=document.getElementById("password").value;

  let savedName=localStorage.getItem("playerName");

  if(!name || !pass){
    document.getElementById("message").innerText=
      "Please enter username and password.";
    return;
  }

  if(savedName && name===savedName){
    playerName=name;
    points=Number(localStorage.getItem("points") || 0);
    showDashboard();
  }else{
    document.getElementById("message").innerText=
      "Account not found. Create an account first.";
  }
}

function earnPoints(amount){
  points += amount;
  localStorage.setItem("points",points);
  updatePoints();
}

function lucky(){
  let number=Math.floor(Math.random()*5)+1;
  alert("Your number is: "+number);

  if(number===5){
    earnPoints(10);
    alert("🎉 You earned 10 virtual points!");
  }else{
    alert("Try again!");
  }
}

function updatePoints(){
  document.getElementById("points").innerText=points;
  document.getElementById("profilePoints").innerText=points;
}

function logout(){
  document.getElementById("dashboard").style.display="none";
  document.getElementById("login").style.display="block";
}

showDashboard();

</script>

</body>
</html>
